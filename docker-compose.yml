version: '3.8'

services:
  aegis-cms:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aegis_college_system
    restart: always
    ports:
      - "5000:5000"
    volumes:
      - ./server/database.sqlite:/app/server/database.sqlite
